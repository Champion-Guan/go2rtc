# 将静态内容部署到 GitHub Pages 的工作流
name: 部署静态文档到 Pages

on:
  # 允许从 Actions 页面手动运行此工作流
  workflow_dispatch:

# 为 GITHUB_TOKEN 设置 GitHub Pages 部署权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一个部署
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: 安装依赖
        run: npm install --no-package-lock
      - name: 构建文档
        run: npm run docs:build
      - name: 复制文档到网站
        run: rsync -a --exclude '.vitepress/' --exclude '说明书.md' 网站/ 网站/.vitepress/dist/
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: 网站/.vitepress/dist

  # 静态部署仅需要一个部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
