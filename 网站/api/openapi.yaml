  /api/ring:
    get:
      summary: 发现 Ring 摄像头
      description: |
        提供 `email`/`password`（可选双重验证 `code`），或提供 `refresh_token`。
        需要双重验证时，返回 JSON 提示，而不是源列表。
      tags: [ 设备发现 ]
      parameters:
        - name: email
          in: query
          required: false
          schema: { type: string }
        - name: password
          in: query
          required: false
          schema: { type: string }
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: refresh_token
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功
          content:
            application/json: { example: "" }

  /api/tuya:
    get:
      summary: 发现涂鸦摄像头
      tags: [ 设备发现 ]
      parameters:
        - name: region
          in: query
          description: 涂鸦接口主机（地区）
          required: true
          schema: { type: string }
          example: "openapi.tuyaus.com"
        - name: email
          in: query
          required: true
          schema: { type: string }
        - name: password
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/discovery" }
        "400":
          description: 参数无效
        "404":
          description: 未找到摄像头
  
