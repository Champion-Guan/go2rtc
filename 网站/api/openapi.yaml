openapi: 3.1.0

info:
  title: go2rtc
  version: 1.9.13
  license: { name: MIT,url: https://opensource.org/licenses/MIT }
  contact: { url: https://github.com/AlexxIT/go2rtc }
  description: |
    功能丰富的摄像头流媒体应用，支持 RTSP、RTMP、HTTP-FLV、WebRTC、MSE、HLS、MP4、MJPEG、HomeKit、FFmpeg 等。

servers:
  - url: http://localhost:1984

tags:
  - name: 应用
    description: "[模块： API](https://github.com/AlexxIT/go2rtc#module-api)"
  - name: 配置
    description: "[配置](https://github.com/AlexxIT/go2rtc#configuration)"
  - name: 流列表
    description: "[模块： Streams](https://github.com/AlexxIT/go2rtc#module-streams)"
  - name: 输出流
  - name: HLS
  - name: 快照
  - name: 输入流
  - name: WebSocket
    description: "WebSocket 接口：`/api/ws`（参见 `api/说明书.md`）"
  - name: 设备发现
  - name: HomeKit
  - name: ONVIF
  - name: RTSPtoWebRTC
  - name: WebTorrent
    description: "[模块： WebTorrent](https://github.com/AlexxIT/go2rtc#module-webtorrent)"
  - name: FFmpeg
  - name: Debug

components:
  parameters:
    stream_src_path:
      name: src
      in: path
      description: 源流名称
      required: true
      schema: { type: string }
      example: camera1

    stream_dst_path:
      name: dst
      in: path
      description: 目标流名称
      required: true
      schema: { type: string }
      example: camera1

    stream_src_query:
      name: src
      in: query
      description: 源流名称
      required: true
      schema: { type: string }
      example: camera1

    hls_session_id_path:
      name: id
      in: path
      description: HLS 会话标识，通过查询参数 `id` 传入
      required: true
      schema: { type: string }
      example: DvmHdd9w

    mp4_filter:
      name: mp4
      in: query
      description: MP4 编码过滤器
      required: false
      schema:
        type: string
        enum: [ "", flac, all ]
      example: flac

    video_filter:
      name: video
      in: query
      description: 视频编码过滤器
      schema:
        type: string
        enum: [ "", all, h264, h265, mjpeg ]
      example: h264,h265

    audio_filter:
      name: audio
      in: query
      description: 音频编码过滤器
      schema:
        type: string
        enum: [ "", all, aac, opus, pcm, pcmu, pcma ]
      example: aac

  responses:
    discovery:
      description: ""
      content:
        application/json:
          example: { streams: [ { "name": "Camera 1","url": "..." } ] }

    webtorrent:
      description: ""
      content:
        application/json:
          example: { share: AKDypPy4zz, pwd: H0Km1HLTTP }

paths:
  /api:
    get:
      summary: 获取应用信息
      tags: [ 应用 ]
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  config_path: { type: string, example: "/config/go2rtc.yaml" }
                  host: { type: string, example: "192.168.1.123:1984" }
                  rtsp:
                    type: object
                    properties:
                      listen: { type: string, example: ":8554" }
                      default_query: { type: string, example: "video&audio" }
                  version: { type: string, example: "1.9.12" }

  /api/exit:
    post:
      summary: 关闭应用
      tags: [ 应用 ]
      parameters:
        - name: code
          in: query
          description: 应用退出码
          required: false
          schema: { type: integer }
          example: 100
      responses:
        default:
          description: ""

  /api/restart:
    post:
      summary: 重启后台进程
      description: 重启后台进程。
      tags: [ 应用 ]
      responses:
        default:
          description: ""

  /api/log:
    get:
      summary: 获取内存日志缓冲区
      description: |
        返回内存环形缓冲区中的当前日志。
      tags: [ 应用 ]
      responses:
        "200":
          description: 成功
          content:
            application/jsonlines:
              example: |
                {"level":"info","version":"1.9.13","platform":"linux/amd64","revision":"dfe4755","time":1766841087331,"message":"go2rtc"}
    delete:
      summary: 清空内存日志缓冲区
      tags: [ 应用 ]
      responses:
        "200":
          description: ""
          content:
            text/plain: { example: "" }

  /api/config:
    get:
      summary: 获取主配置文件内容
      tags: [ 配置 ]
      responses:
        "200":
          description: ""
          content:
            application/yaml: { example: "streams:..." }
        "404":
          description: 未找到配置文件
    post:
      summary: 重写主配置文件
      tags: [ 配置 ]
      requestBody:
        content:
          "*/*": { example: "streams:..." }
      responses:
        default:
          description: ""
    patch:
      summary: 合并修改到主配置文件
      tags: [ 配置 ]
      requestBody:
        content:
          "*/*": { example: "streams:..." }
      responses:
        default:
          description: ""



  /api/streams:
    get:
      summary: 获取全部流信息
      tags: [ 流列表 ]
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    producers:
                      type: array
                    consumers:
                      type: array
    put:
      summary: 创建流
      tags: [ 流列表 ]
      parameters:
        - name: src
          in: query
          description: 流源地址（URI）
          required: true
          schema: { type: string }
          example: "rtsp://rtsp:12345678@192.168.1.123/av_stream/ch0"
        - name: name
          in: query
          description: 流名称
          required: false
          schema: { type: string }
          example: camera1
      responses:
        default:
          description: ""
    patch:
      summary: 更新流源
      tags: [ 流列表 ]
      parameters:
        - name: src
          in: query
          description: 流源地址（URI）
          required: true
          schema: { type: string }
          example: "rtsp://rtsp:12345678@192.168.1.123/av_stream/ch0"
        - name: name
          in: query
          description: 流名称
          required: true
          schema: { type: string }
          example: camera1
      responses:
        default:
          description: ""
    delete:
      summary: 删除流
      tags: [ 流列表 ]
      parameters:
        - name: src
          in: query
          description: 流名称
          required: true
          schema: { type: string }
          example: camera1
      responses:
        default:
          description: ""
    post:
      summary: 将源流发送到目标
      description: "[向摄像头播放音频](https://github.com/AlexxIT/go2rtc#stream-to-camera)"
      tags: [ 流列表 ]
      parameters:
        - name: src
          in: query
          description: 流源地址（URI）
          required: true
          schema: { type: string }
          example: "ffmpeg:http://example.com/song.mp3#audio=pcma#input=file"
        - name: dst
          in: query
          description: 目标流名称
          required: true
          schema: { type: string }
          example: camera1
      responses:
        default:
          description: ""

  /api/streams.dot:
    get:
      summary: 获取 Graphviz DOT 格式流拓扑
      tags: [ 流列表 ]
      parameters:
        - name: src
          in: query
          description: 按流名称过滤，重复 `src` 可包含多个流。
          required: false
          schema: { type: string }
          example: camera1
      responses:
        "200":
          description: 成功
          content:
            text/vnd.graphviz:
              example: "digraph { ... }"

  /api/preload:
    get:
      summary: 获取全部预加载流
      tags: [ 流列表 ]
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    consumer:
                      type: object
                    query:
                      type: string
                      example: "video&audio"
    put:
      summary: 预加载新流
      tags: [ 流列表 ]
      parameters:
        - name: src
          in: query
          description: 流源名称
          required: true
          schema: { type: string }
          example: "camera1"
        - name: video
          in: query
          description: 视频编码过滤器
          required: false
          schema: { type: string }
          example: all,h264,h265,...
        - name: audio
          in: query
          description: 音频编码过滤器
          required: false
          schema: { type: string }
          example: all,aac,opus,...
        - name: microphone
          in: query
          description: 麦克风编码过滤器
          required: false
          schema: { type: string }
          example: all,aac,opus,...
      responses:
        default:
          description: ""
    delete:
      summary: 删除预加载流
      tags: [ 流列表 ]
      parameters:
        - name: src
          in: query
          description: 流源名称
          required: true
          schema: { type: string }
          example: "camera1"
      responses:
        default:
          description: ""

  /api/schemes:
    get:
      summary: 获取受支持的源地址协议
      tags: [ 流列表 ]
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
              example: [ rtsp, rtmp, webrtc, ffmpeg, hass ]


  /api/streams?src={src}:
    get:
      summary: 获取 JSON 格式流信息
      tags: [ 输出流 ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    producers:
                      type: array
                      items: { type: object }
                    consumers:
                      type: array
                      items: { type: object }

  /api/webrtc?src={src}:
    post:
      summary: 获取 WebRTC 格式流（WHEP）
      description: "[模块： WebRTC](https://github.com/AlexxIT/go2rtc#module-webrtc)"
      tags: [ 输出流 ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
      requestBody:
        description: |
          支持：
          - JSON 格式 (`Content-Type: application/json`)
          - WHEP 标准 (`Content-Type: application/sdp`)
          - 原始 SDP (`Content-Type: anything`)
        required: true
        content:
          application/json: { example: { type: offer, sdp: "v=0..." } }
          "application/sdp": { example: "v=0..." }
          "*/*": { example: "v=0..." }
      responses:
        "200":
          description: "JSON 或原始 SDP 请求的响应"
          content:
            application/json: { example: { type: answer, sdp: "v=0..." } }
            application/sdp: { example: "v=0..." }
        "201":
          description: "`Content-Type: application/sdp` 请求的响应"
          content:
            application/sdp: { example: "v=0..." }

  /api/stream.mp4?src={src}:
    get:
      summary: 获取 MP4 格式流（HTTP 渐进式播放）
      description: "[模块： MP4](https://github.com/AlexxIT/go2rtc#module-mp4)"
      tags: [ 输出流 ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
        - name: duration
          in: query
          description: 限制流时长，单位为秒
          required: false
          schema: { type: string }
          example: 15
        - name: filename
          in: query
          description: 以此文件名下载
          required: false
          schema: { type: string }
          example: camera1.mp4
        - name: rotate
          in: query
          description: "视频旋转角度，支持 90、180、270。"
          required: false
          schema: { type: integer, enum: [ 90, 180, 270 ] }
        - name: scale
          in: query
          description: 按 `width:height` 格式缩放视频
          required: false
          schema: { type: string, example: "1280:720" }
        - $ref: "#/components/parameters/mp4_filter"
        - $ref: "#/components/parameters/video_filter"
        - $ref: "#/components/parameters/audio_filter"
      responses:
        200:
          description: ""
          content: { video/mp4: { example: "" } }

  /api/stream.m3u8?src={src}:
    get:
      summary: 获取 HLS 格式流
      description: "[模块： HLS](https://github.com/AlexxIT/go2rtc#module-hls)"
      tags: [ Consume stream, HLS ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
        - $ref: "#/components/parameters/mp4_filter"
        - $ref: "#/components/parameters/video_filter"
        - $ref: "#/components/parameters/audio_filter"
      responses:
        200:
          description: ""
          content: { application/vnd.apple.mpegurl: { example: "" } }

  /api/hls/playlist.m3u8?id={id}:
    get:
      summary: 获取活动会话的 HLS 媒体播放列表
      tags: [ HLS ]
      parameters:
        - $ref: "#/components/parameters/hls_session_id_path"
      responses:
        "200":
          description: 成功
          content:
            application/vnd.apple.mpegurl: { example: "" }
        "404":
          description: 未找到会话

  /api/hls/segment.ts?id={id}:
    get:
      summary: 获取活动会话的 HLS MPEG-TS 分片
      tags: [ HLS ]
      parameters:
        - $ref: "#/components/parameters/hls_session_id_path"
      responses:
        "200":
          description: 成功
          content:
            video/mp2t: { example: "" }
        "404":
          description: 未找到分片或会话

  /api/hls/init.mp4?id={id}:
    get:
      summary: 获取活动会话的 HLS fMP4 初始化分片
      tags: [ HLS ]
      parameters:
        - $ref: "#/components/parameters/hls_session_id_path"
      responses:
        "200":
          description: 成功
          content:
            video/mp4: { example: "" }
        "404":
          description: 未找到分片或会话

  /api/hls/segment.m4s?id={id}:
    get:
      summary: 获取活动会话的 HLS fMP4 媒体分片
      tags: [ HLS ]
      parameters:
        - $ref: "#/components/parameters/hls_session_id_path"
      responses:
        "200":
          description: 成功
          content:
            video/iso.segment: { example: "" }
        "404":
          description: 未找到分片或会话

  /api/stream.mjpeg?src={src}:
    get:
      summary: 获取 MJPEG 格式流
      description: "[模块： MJPEG](https://github.com/AlexxIT/go2rtc#module-mjpeg)"
      tags: [ 输出流 ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
      responses:
        200:
          description: ""
          content: { multipart/x-mixed-replace: { example: "" } }

  /api/stream.ascii?src={src}:
    get:
      summary: 获取字符画格式流（ANSI 转义码）
      description: "[模块： MJPEG](https://github.com/AlexxIT/go2rtc#module-mjpeg)"
      tags: [ 输出流 ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
        - name: color
          in: query
          description: 前景色模式（`8`、`256`、`rgb` 或 ANSI SGR 代码）
          required: false
          schema: { type: string }
        - name: back
          in: query
          description: 背景色模式（`8`、`256`、`rgb` 或 ANSI SGR 代码）
          required: false
          schema: { type: string }
        - name: text
          in: query
          description: 字符集预设（空值/默认、`block`）或自定义字符
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功
          content:
            text/plain: { example: "" }
        "404":
          description: 未找到流

  /api/stream.y4m?src={src}:
    get:
      summary: 获取 YUV4MPEG2 格式流（y4m）
      tags: [ 输出流 ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
      responses:
        "200":
          description: 成功
          content:
            application/octet-stream: { example: "" }
        "404":
          description: 未找到流

  /api/stream.ts?src={src}:
    get:
      summary: 获取 MPEG-TS 格式流
      tags: [ 输出流 ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
      responses:
        "200":
          description: 成功
          content:
            video/mp2t: { example: "" }
        "404":
          description: 未找到流

  /api/stream.aac?src={src}:
    get:
      summary: 获取 AAC（ADTS）格式流音频
      tags: [ 输出流 ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
      responses:
        "200":
          description: 成功
          content:
            audio/aac: { example: "" }
        "404":
          description: 未找到流

  /api/stream.flv?src={src}:
    get:
      summary: 获取 FLV 格式流
      tags: [ 输出流 ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
      responses:
        "200":
          description: 成功
          content:
            video/x-flv: { example: "" }
        "404":
          description: 未找到流

  /api/frame.jpeg?src={src}:
    get:
      summary: 获取 JPEG 格式快照
      description: "[模块： MJPEG](https://github.com/AlexxIT/go2rtc#module-mjpeg)"
      tags: [ 快照 ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
        - name: name
          in: query
          description: `src` 为地址时，可选指定要创建或更新的流名称
          required: false
          schema: { type: string }
        - name: width
          in: query
          description: "缩放输出宽度，别名 `w`"
          required: false
          schema: { type: integer, minimum: 1 }
        - name: height
          in: query
          description: "缩放输出高度，别名 `h`"
          required: false
          schema: { type: integer, minimum: 1 }
        - name: rotate
          in: query
          description: "输出旋转角度，支持 90、180、270。"
          required: false
          schema: { type: integer, enum: [ 90, 180, 270 ] }
        - name: hardware
          in: query
          description: "FFmpeg 快照转码的硬件加速引擎，别名 `hw`"
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ""
          content:
            image/jpeg: { example: "" }

  /api/frame.mp4?src={src}:
    get:
      summary: 获取 MP4 格式快照
      description: "[模块： MP4](https://github.com/AlexxIT/go2rtc#module-mp4)"
      tags: [ 快照 ]
      parameters:
        - $ref: "#/components/parameters/stream_src_path"
        - name: filename
          in: query
          description: 以此文件名下载
          required: false
          schema: { type: string }
          example: camera1.mp4
      responses:
        200:
          description: ""
          content:
            video/mp4: { example: "" }



  /api/webrtc?dst={dst}:
    post:
      summary: 接收 WebRTC 格式推流（WHIP）
      description: "[输入： WebRTC/WHIP](https://github.com/AlexxIT/go2rtc#incoming-webrtcwhip)"
      tags: [ 输入流 ]
      parameters:
        - $ref: "#/components/parameters/stream_dst_path"
      responses:
        "201":
          description: 已创建
          headers:
            Location:
              description: 会话资源地址
              schema: { type: string }
          content:
            application/sdp: { example: "v=0..." }
        "404":
          description: 未找到流

  /api/stream?dst={dst}:
    post:
      summary: 自动识别格式并接收推流
      description: |
        自动识别输入源格式，用于将流推送到已有的 `dst` 流。
      tags: [ 输入流 ]
      parameters:
        - $ref: "#/components/parameters/stream_dst_path"
      responses:
        default:
          description: ""

  /api/stream.flv?dst={dst}:
    post:
      summary: 接收 FLV 格式推流
      description: "[输入源](https://github.com/AlexxIT/go2rtc#incoming-sources)"
      tags: [ 输入流 ]
      parameters:
        - $ref: "#/components/parameters/stream_dst_path"
      responses:
        default:
          description: ""

  /api/stream.ts?dst={dst}:
    post:
      summary: 接收 MPEG-TS 格式推流
      description: "[输入源](https://github.com/AlexxIT/go2rtc#incoming-sources)"
      tags: [ 输入流 ]
      parameters:
        - $ref: "#/components/parameters/stream_dst_path"
      responses:
        default:
          description: ""

  /api/stream.mjpeg?dst={dst}:
    post:
      summary: 接收 MJPEG 格式推流
      description: "[输入源](https://github.com/AlexxIT/go2rtc#incoming-sources)"
      tags: [ 输入流 ]
      parameters:
        - $ref: "#/components/parameters/stream_dst_path"
      responses:
        default:
          description: ""


  /api/ffmpeg:
    post:
      summary: 通过 FFmpeg 向流播放文件、直播或合成语音
      description: |
        用于向摄像头播放音频场景的辅助接口。
        必须且只能提供 `file`、`live`、`text` 之一。
      tags: [ FFmpeg ]
      parameters:
        - name: dst
          in: query
          description: 目标流名称
          required: true
          schema: { type: string }
          example: camera1
        - name: file
          in: query
          description: 按文件处理的输入地址（`#input=file`）
          required: false
          schema: { type: string }
          example: "http://example.com/song.mp3"
        - name: live
          in: query
          description: 实时输入地址
          required: false
          schema: { type: string }
          example: "http://example.com/live.mp3"
        - name: text
          in: query
          description: 文字转语音文本
          required: false
          schema: { type: string }
          example: "Hello"
        - name: voice
          in: query
          description: 可选合成语音音色，取决于引擎
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功
        "400":
          description: 参数无效
        "404":
          description: 未找到流


  /api/dvrip:
    get:
      summary: 发现 DVRIP 摄像头
      description: "[源： DVRIP](https://github.com/AlexxIT/go2rtc#source-dvrip)"
