          example: "onvif://user:pass@192.168.1.50:80"
      responses:
        "200": { $ref: "#/components/responses/discovery" }

  /api/roborock:
    get:
      summary: 发现石头扫地机器人，需先验证身份
      description: "[源： Roborock](https://github.com/AlexxIT/go2rtc#source-roborock)"
      tags: [ 设备发现 ]
      responses:
        "200": { $ref: "#/components/responses/discovery" }
        "404":
          description: 未验证身份
    post:
      summary: 登录石头账户并发现设备
      tags: [ 设备发现 ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
              required: [ username, password ]
      responses:
        "200": { $ref: "#/components/responses/discovery" }

  /api/homekit:
    get:
      summary: 获取 HomeKit 服务器状态
      tags: [ HomeKit ]
      parameters:
        - name: id
          in: query
          description: 可选流名称（服务器标识）
          required: false
          schema: { type: string }
      responses:
        "200":
          description: 成功
          content:
            application/json: { example: "" }
        "404":
          description: 未找到服务器
    post:
      summary: 配对 HomeKit 摄像头并创建或更新流
      tags: [ HomeKit ]
      parameters:
        - name: id
          in: query
          description: 要创建或更新的流名称
          required: true
          schema: { type: string }
        - name: src
          in: query
          description: HomeKit 地址，不含配对码
          required: true
          schema: { type: string }
        - name: pin
          in: query
          description: HomeKit 配对码
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 成功
    delete:
      summary: 取消 HomeKit 摄像头配对并删除流
      tags: [ HomeKit ]
      parameters:
        - name: id
          in: query
          description: 流名称 / 服务器标识
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 成功
        "404":
          description: 未找到流

  /api/homekit/accessories:
    get:
      summary: 获取流的 HomeKit 配件 JSON
      tags: [ HomeKit ]
      parameters:
        - name: id
          in: query
          description: 流名称
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 成功
          content:
            application/json: { example: { } }
        "404":
          description: 未找到流

