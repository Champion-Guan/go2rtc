  /api/ws:
    get:
      summary: WebSocket 接口
      description: |
        升级为 WebSocket 并交换 JSON 消息：
        - 请求： `{ "type": "...", "value": ... }`
        - 响应： `{ "type": "...", "value": ... }`
        
        支持的消息类型取决于已启用模块，参见 `api/说明书.md`。
      tags: [ WebSocket ]
      parameters:
        - name: src
          in: query
          description: 流名称（消费者）
          required: false
          schema: { type: string }
        - name: dst
          in: query
          description: 流名称（生产者）
          required: false
          schema: { type: string }
      responses:
        "101": { description: 切换协议 }



