<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>播放链接 - go2rtc</title>
    <style>
        div > li {
            list-style-type: none;
            padding-left: 10px;
            position: relative;
        }

        div > li:before {
            content: "-";
            position: absolute;
            left: 0;
        }
    </style>
</head>
<body>

<script src="公共界面.js"></script>

<main>
    <div id="links"></div>
    <script>
        const src = new URLSearchParams(location.search).get('src').replace(/[<">]/g, ''); // sanitize

        const links = document.getElementById('links');

        links.innerHTML = `
        <h2>任意编码格式的视频源</h2>
        <li><a href="视频预览.html?src=${src}">视频预览.html</a> 自动选择播放模式 / 浏览器：全部 / 编码： H264, H265*, MJPEG, JPEG, AAC, PCMU, PCMA, OPUS</li>
        <li><a href="api/streams?src=${src}">info.json</a> 当前活动连接详情</li>
    `;

        const url = new URL('api', location.href);
        fetch(url, {cache: 'no-cache'}).then(r => r.json()).then(data => {
            let rtsp = location.host + ':8554';
            try {
                const host = data.host.match(/^[^:]+/)[0];
                const port = data.rtsp.listen.match(/[0-9]+$/)[0];
                rtsp = `${host}:${port}`;
            } catch (e) {
            }

            links.innerHTML += `
            <li><a href="rtsp://${rtsp}/${src}">rtsp</a> 单路视频和单路音频 / 编码：任意</li>
            <li><a href="rtsp://${rtsp}/${src}?mp4">rtsp</a> 用于 MP4 录像（Home Assistant 或 Frigate）/ 编码： H264, H265, AAC</li>
            <li><a href="rtsp://${rtsp}/${src}?video=all&audio=all">rtsp</a> 所有轨道 / 编码：任意</li>

            <pre>ffplay -fflags nobuffer -flags low_delay -rtsp_transport tcp "rtsp://${rtsp}/${src}"</pre>

            <h2>H264/H265 视频源</h2>
            <li><a href="视频预览.html?src=${src}&mode=webrtc">视频预览.html</a> WebRTC 流 / 浏览器：全部 / 编码： H264, PCMU, PCMA, OPUS / Safari 另支持 H265</li>
            <li><a href="视频预览.html?src=${src}&mode=mse">视频预览.html</a> MSE 流 / 浏览器： Chrome, Firefox, Safari Mac/iPad / 编码： H264, H265*, AAC, PCMA*, PCMU*, PCM* / Chrome 和 Firefox 另支持 OPUS</li>
            <li><a href="api/stream.mp4?src=${src}">stream.mp4</a> 带 AAC 音频的传统 MP4 流 / 浏览器： Chrome, Firefox / 编码： H264, H265*, AAC</li>
            <li><a href="api/stream.mp4?src=${src}&mp4=flac">stream.mp4</a> 带常见音频的现代 MP4 流 / 浏览器： Chrome, Firefox / 编码： H264, H265*, AAC, FLAC (PCMA, PCMU, PCM)</li>
            <li><a href="api/stream.mp4?src=${src}&mp4=all">stream.mp4</a> 支持任意音频的 MP4 流 / 浏览器： Chrome / 编码： H264, H265*, AAC, OPUS, MP3, FLAC (PCMA, PCMU, PCM)</li>
            <li><a href="api/frame.mp4?src=${src}">frame.mp4</a> MP4 格式快照 / 浏览器：全部 / 编码： H264, H265*</li>
            <li><a href="api/stream.m3u8?src=${src}">stream.m3u8</a> 传统 HLS/TS / 浏览器： Safari all, Chrome Android / 编码： H264</li>
            <li><a href="api/stream.m3u8?src=${src}&mp4">stream.m3u8</a> 传统 HLS/fMP4 / 浏览器： Safari all, Chrome Android / 编码： H264, H265*, AAC</li>
            <li><a href="api/stream.m3u8?src=${src}&mp4=flac">stream.m3u8</a> 现代 HLS/fMP4 / 浏览器： Safari all, Chrome Android / 编码： H264, H265*, AAC, FLAC (PCMA, PCMU, PCM)</li>

            <h2>MJPEG 视频源</h2>
            <li><a href="视频预览.html?src=${src}&mode=mjpeg">视频预览.html</a> MJPEG 播放模式 / 浏览器：全部 / 编码： MJPEG, JPEG</li>
            <li><a href="api/stream.mjpeg?src=${src}">stream.mjpeg</a> MJPEG 流 / 浏览器：全部 / 编码： MJPEG, JPEG</li>
            <li><a href="api/frame.jpeg?src=${src}">frame.jpeg</a> JPEG 格式快照 / 浏览器：全部 / 编码： MJPEG, JPEG</li>
        `;
        });
    </script>

    <div id="homekit" style="display: none">
        <h2>HomeKit 服务</h2>
    </div>
    <script>
        fetch(`api/homekit?id=${src}`, {cache: 'no-cache'}).then(async (r) => {
            if (!r.ok) return;

            const div = document.querySelector('#homekit');
            div.innerHTML += `<div><a href="${r.url}">info.json</a> 当前活动连接详情</div>`;
            div.style = '';

            /** @type {{name: string, category_id: string, setup_code: string, setup_id: string, setup_uri: string}} */
            const data = await r.json();
            if (data.setup_code === undefined) return;

            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';
            script.async = true;
            script.onload = () => {
                /* global BigInt */
                const categoryID = BigInt(data.category_id);
                const pin = BigInt(data.setup_code.replaceAll('-', ''));
                const payload = categoryID << BigInt(31) | BigInt(2 << 27) | pin;
                const setupURI = `X-HM://${payload.toString(36).toUpperCase().padStart(9, '0')}${data.setup_id}`;

                div.innerHTML += `<pre>配对名称： ${data.name}
配对码： ${data.setup_code}</pre>
<div id="homekit-qrcode"></div>`;

                /* global QRCode */
                new QRCode('homekit-qrcode', {text: setupURI, width: 128, height: 128});
            };
            document.head.appendChild(script);
        });
    </script>

    <div>
        <h2>播放音频</h2>
        <label><input type="radio" name="play" value="file" checked>
            文件：播放远程（https://example.com/song.mp3）或本地（/media/song.mp3）文件
        </label>
        <label><input type="radio" name="play" value="live">
            直播：播放远程实时流（例如网络电台）
        </label>
        <label><input type="radio" name="play" value="text">
            文本：播放文字转语音内容（需要 FFmpeg 支持）
        </label>
        <br>
        <input id="play-url" type="text" placeholder="路径 / 地址 / 文本">
        <button id="play-send">发送</button>
        / 需要摄像头支持双向音频
    </div>
    <script>
        document.getElementById('play-send').addEventListener('click', ev => {
            ev.preventDefault();
            // action - file / live / text
            const action = document.querySelector('input[name="play"]:checked').value;
            const url = new URL('api/ffmpeg', location.href);
            url.searchParams.set('dst', src);
            url.searchParams.set(action, document.getElementById('play-url').value);
            fetch(url, {method: 'POST'});
        });
    </script>

    <div>
        <h2>推送视频流</h2>
        <pre>YouTube:  rtmps://xxx.rtmp.youtube.com/live2/xxxx-xxxx-xxxx-xxxx-xxxx
Telegram: rtmps://xxx-x.rtmp.t.me/s/xxxxxxxxxx:xxxxxxxxxxxxxxxxxxxxxx</pre>
        <input id="pub-url" type="text" placeholder="推流地址">
        <button id="pub-send">发送</button>
        / Telegram RTMPS 服务器
    </div>
    <script>
        document.getElementById('pub-send').addEventListener('click', ev => {
            ev.preventDefault();
            const url = new URL('api/streams', location.href);
            url.searchParams.set('src', src);
            url.searchParams.set('dst', document.getElementById('pub-url').value);
            fetch(url, {method: 'POST'});
        });
    </script>

    <div id="webrtc">
        <h2>WebRTC 高级功能</h2>
        <label><input type="radio" name="webrtc" value="video+audio" checked>
            视频 + 音频：普通预览
        </label>
        <label><input type="radio" name="webrtc" value="video+audio+microphone">
            视频 + 音频 + 麦克风：摄像头双向对讲
        </label>
        <label><input type="radio" name="webrtc" value="camera+microphone">
            摄像头 + 麦克风：从浏览器推流
        </label>
        <label><input type="radio" name="webrtc" value="display+speaker">
            屏幕 + 系统音频：屏幕广播
        </label>

        <br>
        <li><a id="local" href="WebRTC预览.html?src=">WebRTC预览.html</a> 本地 WebRTC 播放器</li>

        <li>
            <a id="shareadd" href="#">创建分享链接</a>
            <a id="shareget" href="#">复制链接</a>
            <a id="sharedel" href="#">删除</a>
            外部 WebRTC 播放器
        </li>
    </div>
    <script>
        function webrtcLinksUpdate() {
            const media = document.querySelector('input[name="webrtc"]:checked').value;

            const direction = media.indexOf('video') >= 0 || media === 'audio' ? 'src' : 'dst';
            document.getElementById('local').href = `WebRTC预览.html?${direction}=${src}&media=${media}`;

            const share = document.getElementById('shareget');
            share.href = `https://go2rtc.org/webtorrent/#${share.dataset.auth}&media=${media}`;
        }

        function share(method) {
            const url = new URL('api/webtorrent', location.href);
            url.searchParams.set('src', src);
            return fetch(url, {method: method, cache: 'no-cache'});
        }

        function onshareadd(r) {
            document.getElementById('shareget').dataset['auth'] = `share=${r.share}&pwd=${r.pwd}`;

            document.getElementById('shareadd').style.display = 'none';
            document.getElementById('shareget').style.display = '';
            document.getElementById('sharedel').style.display = '';

            webrtcLinksUpdate();
        }

        function onsharedel() {
            document.getElementById('shareadd').style.display = '';
            document.getElementById('shareget').style.display = 'none';
            document.getElementById('sharedel').style.display = 'none';
        }

        function copyTextToClipboard(text) {
            // https://web.dev/patterns/clipboard/copy-text
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).catch(err => {
                    console.error(err.name, err.message);
                });
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);

                textarea.focus();
                textarea.select();

                try {
                    document.execCommand('copy');
                } catch (err) {
                    console.error(err.name, err.message);
                }

                document.body.removeChild(textarea);
            }
        }

        document.getElementById('shareadd').addEventListener('click', ev => {
            ev.preventDefault();
            share('POST').then(r => r.json()).then(r => onshareadd(r));
        });

        document.getElementById('shareget').addEventListener('click', ev => {
            ev.preventDefault();
            copyTextToClipboard(ev.target.href);
        });

        document.getElementById('sharedel').addEventListener('click', ev => {
            ev.preventDefault();
            share('DELETE').then(() => onsharedel());
        });

        document.getElementById('webrtc').addEventListener('click', ev => {
            if (ev.target.tagName === 'INPUT') webrtcLinksUpdate();
        });

        share('GET').then(r => {
            if (r.ok) r.json().then(r => onshareadd(r));
            else onsharedel();
        });

        webrtcLinksUpdate();
    </script>
</main>

</body>
</html>
